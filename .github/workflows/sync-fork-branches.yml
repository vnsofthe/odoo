name: Sync selected upstream branches

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ["18.0", "19.0"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ matrix.branch }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch branch
        run: |
          git remote add upstream https://github.com/odoo/odoo.git
          git fetch upstream ${{ matrix.branch }}

      - name: Hard sync branch
        run: |
          git checkout ${{ matrix.branch }}
          git reset --hard upstream/${{ matrix.branch }}
          git push origin ${{ matrix.branch }} --force
